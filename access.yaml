# Who may do what on the nodes. `orphera issue-policy` puts it on each node;
# the agent then allows each call only to a role that may make it. The role is
# in the operator's client certificate (orphera issue-client-cert --operator X
# --role R). See docs/ACCESS-CONTROL-DESIGN.md.
#
# A role with `run` (or `all`) is root on the node: no list of operations
# changes that. `orphera apply` needs facts and observe to read, then the typed
# operation its kinds use: apply-files (file, directory, symlink, line, sysctl,
# kernel_module), apply-access (user, group, authorized_key, mount),
# apply-software (package, service). Only a `command` resource needs run.
# observe and the apply-* operations need Go agents 0.1.213 / .214 / .215 / .216;
# issue-policy refuses a node whose agent does not know one the policy names.
#
# Operations: facts version uptime thread-info check-file observe apply-files
#             apply-access apply-software fetch copy packages run reboot
#             shutdown network, or all.

# The role of a certificate with no role in it: the orchestrator's own
# client.crt. admin keeps everything working as before for it.
default_role: admin

roles:
  viewer:
    allow: [facts, version, uptime, thread-info, check-file, fetch]
  deployer:
    allow: [facts, version, uptime, check-file, fetch, copy, packages]
    nodes: [group:ceph]
    # paths: [/etc/ceph/, /srv/]   # limits copy, check-file and fetch to these prefixes (Go agent 0.1.212+)
  # A viewer that may also `apply --check` needs observe too, once every node
  # runs agent 0.1.213 or later:  allow: [facts, observe, version, ...]
  # Applying descriptions without run, tried on tst39 (agent 0.1.216):
  applier:
    allow: [facts, version, observe, apply-files, apply-access, apply-software]
    nodes: [tst39]
  rebooter:
    allow: [facts, version, uptime, check-file, reboot, shutdown]
    nodes: [group:ceph]
  admin:
    allow: all

# Serial numbers (hexadecimal) of operator certificates to refuse before they
# expire: openssl x509 -noout -serial -in certs/operators/alice.crt
revoked: []   # in quotes, e.g. ["1a2b3c"]

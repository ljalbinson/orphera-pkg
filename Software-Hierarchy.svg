.coral rect{fill:#712B13;stroke:#F0997B}.coral .bt{fill:#F5C4B3}.coral .bs{fill:#F0997B}
.gray rect{fill:#444441;stroke:#B4B2A9}.gray .bt{fill:#D3D1C7}.gray .bs{fill:#B4B2A9}

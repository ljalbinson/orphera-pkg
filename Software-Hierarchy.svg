.amber rect{fill:#FAEEDA;stroke:#854F0B}.amber .bt{fill:#633806}.amber .bs{fill:#854F0B}
.coral rect{fill:#FAECE7;stroke:#993C1D}.coral .bt{fill:#712B13}.coral .bs{fill:#993C1D}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .bt{fill:#444441}.gray .bs{fill:#5F5E5A}

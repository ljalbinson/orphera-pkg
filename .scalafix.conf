rules = [
  OrganizeImports,
  RemoveUnused,
  DisableSyntax,
  LeakingImplicitClassVal,
  NoValInForComprehension,
  RedundantSyntax
]

OrganizeImports {
  targetDialect = Scala3
  removeUnused = true
  groupedImports = Merge
  groups = ["re:javax?\\.", "scala.", "cats.", "fs2.", "*", "orphera."]
}

# OrganizeImports handles imports
RemoveUnused.imports = false

DisableSyntax {
  noFinalize = true
  noValPatterns = true
  noXml = true
}

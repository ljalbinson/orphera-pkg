---
# Ansible equivalent of Orphera's ceph-teardown.yaml.
# Stops mon/OSD services, wipes mon data and /dev/sdb, and purges ceph
# packages across tst0, tst1, tst2.
#
# Run: ansible-playbook -i inventory ceph-teardown.yml

- name: Stop mon service and wipe mon data
  hosts: tst0,tst1,tst2
  become: true
  tasks:
    - name: Stop mon service for this host
      ansible.builtin.shell: |
        systemctl stop ceph-mon@$(hostname -s) 2>/dev/null
        systemctl reset-failed ceph-mon@$(hostname -s) 2>/dev/null
        true
      changed_when: false

    - name: Remove mon data and ceph config
      ansible.builtin.shell: |
        MONID=$(hostname -s)
        rm -rf /var/lib/ceph/mon/ceph-$MONID
        rm -f /etc/ceph/ceph.conf /etc/ceph/monmap /etc/ceph/fsid
        rm -f /etc/ceph/ceph.mon.keyring /etc/ceph/ceph.client.admin.keyring
        true
      changed_when: false

- name: Stop OSD services and zap /dev/sdb
  hosts: tst0,tst1,tst2
  become: true
  tasks:
    - name: Stop OSD/ceph-volume service(s)
      ansible.builtin.shell: |
        for u in $(systemctl list-units --all --plain --no-legend 'ceph-osd@*' 'ceph-volume@*' | awk '{print $1}'); do
          systemctl stop "$u" 2>/dev/null
          systemctl reset-failed "$u" 2>/dev/null
        done
        true
      changed_when: false

    - name: Zap /dev/sdb (destroy LV/VG/PV and wipe signatures)
      ansible.builtin.shell: |
        # Deliberately NOT calling `ceph-volume lvm zap` — it shells out to
        # `udevadm settle` internally, which hangs indefinitely on these VMs
        # (udev never fires the events it waits for). Do the same job
        # directly with `timeout` guards on every LVM call so a stuck
        # lock/device can never hang the whole teardown again.
        for vg in $(timeout 10 pvs --noheadings -o vg_name /dev/sdb 2>/dev/null | tr -d ' '); do
          [ -n "$vg" ] || continue
          timeout 15 lvremove -f "$vg" 2>/dev/null
          timeout 15 vgremove -f "$vg" 2>/dev/null
        done
        timeout 15 pvremove -ff -y /dev/sdb 2>/dev/null || true
        wipefs -a /dev/sdb 2>/dev/null || true
        dd if=/dev/zero of=/dev/sdb bs=1M count=10 oflag=direct,dsync 2>/dev/null || true
        partprobe /dev/sdb 2>/dev/null || true
        true
      changed_when: false

- name: Purge ceph packages
  hosts: tst0,tst1,tst2
  become: true
  tasks:
    - name: Purge ceph packages
      ansible.builtin.apt:
        name:
          - ceph-osd
          - ceph-mon
          - ceph-base
          - ceph-common
        state: absent
        purge: true

    - name: Autoremove leftover dependencies
      ansible.builtin.apt:
        autoremove: true
        purge: true

    - name: Remove remaining ceph directories
      ansible.builtin.shell: |
        rm -rf /var/lib/ceph /var/log/ceph /var/run/ceph
        rm -rf /etc/ceph/*
        true
      changed_when: false

#
# systemd drop-in that runs the Go agent in place of the Scala one, for
# trying it on a test node. It leaves the installed package alone:
#
#   sudo install -m 0755 orphera-agent-go-amd64 /opt/orphera-agent/orphera-agent-go
#   sudo install -D -m 0644 orphera-agent-go.conf \
#       /etc/systemd/system/orphera-agent.service.d/orphera-agent-go.conf
#   sudo systemctl daemon-reload && sudo systemctl restart orphera-agent
#
# To go back to the Scala agent, remove this file, then daemon-reload and
# restart. The drop-in survives an upgrade of the orphera-agent package, so
# while it is in place an upgrade does not bring the Scala agent back.
[Service]
WorkingDirectory=/etc/orphera-agent
ExecStart=
ExecStart=/opt/orphera-agent/orphera-agent-go

name: ceph-mon-quorum

stages:
  - name: install-mon-daemon
    nodes: [tst0, tst1, tst4]
    tasks:
      - name: install ceph-mon
        install:
          packages: [ceph-mon, ceph-base]
          version: "{{ceph_version}}"
          update_cache: true

  - name: bootstrap-mon-config
    nodes: [tst0]
    tasks:
      - name: generate fsid and ceph.conf
        run_command:
          command:
            - sh
            - -c
            - |
              FSID=$(cat /proc/sys/kernel/random/uuid)
              cat > /etc/ceph/ceph.conf <<EOF
              [global]
              fsid = $FSID
              mon_initial_members = tst0, tst1, tst4
              mon_host = {{cluster_ip}}, {{nodes.tst1.cluster_ip}}, {{nodes.tst4.cluster_ip}}
              auth_cluster_required = cephx
              auth_service_required = cephx
              auth_client_required = cephx
              EOF
              echo "$FSID" > /etc/ceph/fsid

      - name: build monmap
        run_command:
          command:
            - sh
            - -c
            - |
              FSID=$(cat /etc/ceph/fsid)
              monmaptool --create --clobber --fsid "$FSID" \
                --add tst0 {{cluster_ip}} \
                --add tst1 {{nodes.tst1.cluster_ip}} \
                --add tst4 {{nodes.tst4.cluster_ip}} \
                /etc/ceph/monmap

  - name: distribute-mon-config
    nodes: [tst1, tst4]
    tasks:
      - name: distribute ceph.conf from tst0
        distribute_file:
          source_node: tst0
          source_path: /etc/ceph/ceph.conf
          dest_path: /etc/ceph/ceph.conf
          owner: root
          group: root
          mode: "0644"

      - name: distribute monmap from tst0
        distribute_file:
          source_node: tst0
          source_path: /etc/ceph/monmap
          dest_path: /etc/ceph/monmap
          owner: root
          group: root
          mode: "0644"

  - name: mkfs-and-start
    nodes: [tst0, tst1, tst4]
    tasks:
      - name: prepare mon data dir and mkfs
        run_command:
          command:
            - sh
            - -c
            - |
              MONID=$(hostname -s)
              if [ -d /var/lib/ceph/mon/ceph-$MONID ] && [ ! -f /var/lib/ceph/mon/ceph-$MONID/keyring ]; then
                rm -rf /var/lib/ceph/mon/ceph-$MONID
              fi
              mkdir -p /var/lib/ceph/mon/ceph-$MONID
              ceph-mon --mkfs -i $MONID --monmap /etc/ceph/monmap --keyring /etc/ceph/ceph.mon.keyring
              test -f /var/lib/ceph/mon/ceph-$MONID/keyring || { echo "mkfs failed"; exit 1; }
              chown -R ceph:ceph /var/lib/ceph/mon/ceph-$MONID /etc/ceph

      - name: enable and start mon service
        run_command:
          command: ["sh", "-c", "systemctl reset-failed ceph-mon@$(hostname -s) 2>/dev/null; systemctl enable --now ceph-mon@$(hostname -s)"]

  - name: confirm-quorum
    nodes: [tst0]
    wait_for:
      nodes: [tst0, tst1, tst4]
      command:
        - sh
        - -c
        - "ceph --admin-daemon /var/run/ceph/ceph-mon.$(hostname -s).asok mon_status 2>/dev/null | grep -Eq '\"state\":\\s*\"(leader|peon)\"'"
      required: 2
      poll_interval: 5
      timeout: 120
    tasks:
      - name: quorum confirmed
        debug:
          message: "Mon cluster has reached quorum."

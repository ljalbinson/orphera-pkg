# apt update -> apt dist-upgrade -> apt autoremove across the test nodes,
# using the native dist_upgrade and autoremove tasks (both show up in the
# agent's apt handling; dist_upgrade runs `apt-get update` first by default,
# keeps existing config files, and never prompts).
name: apt-dist-upgrade

nodes:
  - tst0
  - tst1
  - tst2
  - tst3
  - tst4
  - tst5

tasks:
  - name: apt update and dist-upgrade
    dist_upgrade:
      update_cache: true

  - name: apt autoremove
    autoremove:
      purge: false

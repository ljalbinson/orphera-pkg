---
# Control case: exercises the same flat-playbook path as
# exit_code_fail.yaml, but should genuinely succeed — proves the fix
# didn't just make every playbook exit nonzero regardless of outcome.
name: exit-code-regression-pass

nodes:
  - tst0

tasks:
  - name: deliberately succeed
    run_command:
      command: ["sh", "-c", "exit 0"]
      timeout: 10

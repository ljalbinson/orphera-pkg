name: mini-cluster

stages:
  - name: primary
    nodes: [tst0]
    tasks:
      - name: write readiness sentinel
        copy:
          src: files/ready-sentinel.txt
          dest: /tmp/orphera-ready
          owner: root
          group: root
          mode: "0644"

  - name: secondaries
    nodes: [tst1, tst4, tst5]
    wait_for:
      on_node: tst0
      sentinel_path: /tmp/orphera-ready
      expected_sha256: "ed1a545bb85e55816bbf9566b028b2a0bc456b88f49f6f266c0401048824194b"
      timeout: 60
    tasks:
      - name: install curl
        install:
          packages: [curl]

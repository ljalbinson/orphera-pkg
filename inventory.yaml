# yaml-language-server: $schema=schemas/inventory.schema.json
nodes:
  - name: tst0
    host: tst0.ljalbinson.com
    vars:
      cluster_ip: "10.10.5.12"
      ceph_role: mon-leader
      # Confirmed 2026-09-28 via `lsblk` + `ls /dev/disk/by-id/` on the
      # host itself, after a live incident where /dev/sdX letters (not
      # by-id paths) were hardcoded separately in cephadm_add_osds.scala
      # AND cephadm_teardown.scala, drifted out of sync with each other
      # and with reality after a reboot moved this host's OS disk onto
      # /dev/sdb — the device both files had assumed was a spare OSD
      # disk. by-id paths are tied to the underlying QEMU drive's SCSI
      # address and don't move across reboots; this host's OS disk sits
      # at scsi0-0-0-0, so it's deliberately not listed in either var
      # below. See CHANGELOG for the full incident writeup.
      #
      # osd_disks: disks cephadm_add_osds.scala actually turns into OSDs.
      # zap_disks: every spare disk cephadm_teardown.scala should wipe —
      #   deliberately the full set, even disks osd_disks doesn't
      #   currently use, so a disk that drops out of osd_disks in a
      #   future edit still gets its stale signature cleared on the next
      #   teardown rather than silently keeping one from a much earlier run.
      # tst0 was rebuilt by kvm_zfs_vm_provision.scala with fixed disk serials
      # (<vm>-dataN), so these by-id names no longer depend on SCSI slot.
      osd_disks: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_tst0-data1,/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_tst0-data2"
      zap_disks: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_tst0-data1,/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_tst0-data2"

  - name: tst1
    host: tst1.ljalbinson.com
    vars:
      cluster_ip: "10.10.5.13"
      # This host's OS disk sits at scsi0-0-0-0 — a different SCSI slot
      # than tst0's OS disk. That's expected, not a typo: by-id mapping
      # is per-host, never assumed to match across hosts. Only one of
      # this host's two spare disks is turned into an OSD (matching the
      # original single-OSD-per-node intent for tst1/tst2) — the other
      # is still covered by zap_disks so it gets cleared regardless.
      osd_disks: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_tst1-data1,/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_tst1-data2"
      zap_disks: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_tst1-data1,/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_tst1-data2"

  - name: tst2
    host: tst2.ljalbinson.com
    vars:
      cluster_ip: "10.10.5.14"
      osd_disks: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_tst2-data1,/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_tst2-data2"
      zap_disks: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_tst2-data1,/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_tst2-data2"

  # Node roles (reassigned 2026-10-10):
  #   tst0-tst2   Ceph (mon + OSDs); etcd, when used, also lives here
  #   tst3-tst5   MariaDB Galera + haproxy + keepalived (VIP 10.10.5.100)
  #   tst6        Keystone
  #   tst7        WordPress, Prometheus + Grafana (small test workloads)
  #   tst8        Rocky Linux test node
  #   tst9        Kolla image cache
  #   tst10       Cinder + RabbitMQ
  #   tst13       Glance, Placement, Horizon
  #   tst14       Nova control plane (API, scheduler, conductor, noVNC proxy)
  #   tst19       Neutron (server, Open vSwitch + DHCP agents); its second NIC (br-net106) is the
  #               flat provider network, no address on it
  #   tst17, tst18  second NIC on br-net106 (provider network): nova-compute (nova_compute.scala)
  #   tst15       control and build host, a second scala0 (control_host.scala, control_host_handover.scala)
  #   tst16       Designate (DNS as a service) with BIND9: designate_single_node.scala
  #   tst11       apt cache (apt-cacher-ng)
  #   tst12       rpm cache (nginx caching mirror of Rocky/EPEL)
  #   tst26       Keycloak (keycloak_single_node.scala), the OIDC identity provider Keystone federates to
  #   tst30-tst39 Kubernetes cluster on VLAN 103 (see the entries below)
  # No osd_disks/zap_disks on tst3 and up: no Ceph role there (see the
  # incident note on tst0 above for why disk paths are never guessed).
  - name: tst3
    host: tst3.ljalbinson.com
    vars:
      cluster_ip: "10.10.5.15"

  - name: tst4
    host: tst4.ljalbinson.com
    vars:
      cluster_ip: "10.10.5.16"

  - name: tst5
    host: tst5.ljalbinson.com
    vars:
      cluster_ip: "10.10.5.17"

  - name: tst6
    host: tst6.ljalbinson.com
    vars:
      cluster_ip: "10.10.5.18"

  - name: tst7
    host: tst7.ljalbinson.com
    vars:
      cluster_ip: "10.10.5.19"

  # Rocky Linux 10 (the dnf/rpm test node), on gs3.
  - name: tst8
    host: tst8.ljalbinson.com
    vars:
      cluster_ip: "10.10.5.20"

  # Kolla image cache for the OpenStack work: a pull-through registry mirror of
  # quay.io (manifests/kolla_cache.scala), so nodes pull Kolla images from here
  # instead of the internet each time.
  - name: tst9
    host: tst9.ljalbinson.com
    vars:
      cluster_ip: "10.10.5.21"

  # Cinder (OpenStack block storage, Ceph RBD backend) with its RabbitMQ:
  # manifests/cinder_single_node.scala.
  - name: tst10
    host: tst10.ljalbinson.com
    vars:
      cluster_ip: "10.10.5.22"

  # apt package cache (apt-cacher-ng): manifests/apt_cache.scala; nodes are
  # pointed at it by manifests/apt_cache_clients.scala.
  - name: tst11
    host: tst11.ljalbinson.com
    vars:
      cluster_ip: "10.10.5.23"


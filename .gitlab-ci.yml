# SPDX-License-Identifier: Apache-2.0
image: eclipse-temurin:21-jdk

stages:
  - build
  - orphera

variables:
  SBT_VERSION: "1.10.7"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .ivy2/
    - .sbt/
    - .cache/

before_script:
  - apt-get update -qq && apt-get install -y -qq curl gnupg git python3
  - curl -fL "https://github.com/sbt/sbt/releases/download/v${SBT_VERSION}/sbt-${SBT_VERSION}.tgz" | tar xz -C /usr/local
  - export PATH="/usr/local/sbt/bin:$PATH"
  - export SBT_OPTS="-Dsbt.ivy.home=$CI_PROJECT_DIR/.ivy2 -Dsbt.global.base=$CI_PROJECT_DIR/.sbt"

compile_and_test:
  stage: build
  script:
    - utils/check-no-secrets.sh
    - utils/spdx.py --check
    - bash utils/test-shell-sources.sh
    - sbt clean compile "scalafixAll --check" test
    - sbt agent/assembly orchestrator/assembly scripting/assembly
  # The three jars, from the same commit that just passed the checks above
  # (artifacts are kept for a successful job only). Download them from the job
  # page, or the pipeline's Jobs tab.
  artifacts:
    name: "orphera-jars-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 weeks
    paths:
      - agent/target/scala-3.8.4/agent-assembly-*.jar
      - orchestrator/target/scala-3.8.4/orchestrator-assembly-*.jar
      - scripting/target/scala-3.8.4/scripting-assembly-*.jar

# The Go agent: vet and tests with the race detector (`make test`, which `deb` and
# `rpm` run first), then the amd64 packages. Same Docker runner as the job above,
# with its own image, so nothing is installed on the runner. The Go version is the
# `go` line of agent-go/go.mod. The global before_script is for sbt, so this job
# replaces it with the one tool it needs, rpmbuild.
go_agent:
  stage: build
  image: golang:1.22
  variables:
    GOPATH: "$CI_PROJECT_DIR/.go"
  cache:
    key: "go-$CI_COMMIT_REF_SLUG"
    paths:
      - .go/pkg/mod/
  before_script:
    - apt-get update -qq && apt-get install -y -qq rpm
  script:
    - go version
    - make -C agent-go deb rpm
  artifacts:
    name: "orphera-agent-go-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 weeks
    paths:
      - agent-go/orphera-agent_*_amd64.deb
      - agent-go/orphera-agent-*.x86_64.rpm

# Runs on runner0 (shell executor, tag orphera): see docs/GITLAB-RUNNER.md. The
# global image, cache and before_script above are for the Docker runners, so this
# job turns them off. `needs: []` starts it at once instead of after the build stage,
# which waits for a Docker runner. Needs the protected CI variables ORPHERA_TOKEN,
# ORPHERA_OPERATOR and ORPHERA_CERTS_DIR, so it runs on protected branches only.
# The `pipeline` role in access.yaml allows version, facts, uptime and observe on
# tst0 and nothing else (the inventory is the checkout's: -I goes before the
# command): widen it before adding jobs that touch other nodes.
orphera-reachable:
  stage: orphera
  tags: [orphera]
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  cache: []
  before_script: []
  script:
    - orphera -I "$CI_PROJECT_DIR/inventory.yaml" version --nodes tst0

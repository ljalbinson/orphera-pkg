# tst38: Kubernetes workload worker.
# Kubernetes cluster on tst30-tst39 (kubeadm, containerd, Cilium), on VLAN 103 (10.10.3.0/24, bridge br-net103).
params:
  pre_basic_packages:
  - qemu-guest-agent
  basic_packages:
  - htop
  - tree
  - etckeeper
  - molly-guard
  - cpu-checker
  - iperf3
  - fping
  nic0:
    nic: enp1s0
    ipaddress: '10.10.3.38'
    gateway: '10.10.3.1'
    bridge: br-net103
    netmask: '255.255.255.0'
    table: 1
    priority: 101
    cidr: '10.10.3.0/24'
    mtu: 1500
  hypervisor: gs3
  hostname: tst38
  disk: '80'
  dns1: '192.168.1.70'
  memory: '16384'
  os: noble-server-cloudimg-amd64.img
  nics: []
  domainname: ljalbinson.com
  host_type: host-passthrough
  dns2: '192.168.1.71'
  disks: []
  cpu: '4'
  pdisks: []

# DNS settings for manifests/set_dns.scala. Run with:
#   orphera cluster-playbook manifests/set_dns.scala --config config/dns.yaml
#
# Same top-level `params:` shape as the per-VM config files, so the
# playbook can also be pointed at one of those (config/testvm0-config.yaml)
# and pick up its dns1/dns2/domainname instead of the keys below.
params:
  # Nodes to configure. Must be names from inventory.yaml.
  nodes: [tst0, tst1, tst2, tst3, tst4, tst5]

  # Resolvers, in order of preference. IPv4 or IPv6 literals only.
  dns_servers:
    - 192.168.1.70
    - 192.168.1.71

  # Optional search domains.
  search_domains:
    - ljalbinson.com

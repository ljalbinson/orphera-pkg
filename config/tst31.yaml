# tst31: Kubernetes control plane, stacked etcd (the extra 20 GB disk is for /var/lib/etcd).
# Kubernetes cluster on tst30-tst39 (kubeadm, containerd, Cilium), on VLAN 103 (10.10.3.0/24, bridge br-net103).
params:
  pre_basic_packages:
  - qemu-guest-agent
  basic_packages:
  - htop
  - tree
  - etckeeper
  - molly-guard
  - cpu-checker
  - iperf3
  - fping
  nic0:
    nic: enp1s0
    ipaddress: '10.10.3.31'
    gateway: '10.10.3.1'
    bridge: br-net103
    netmask: '255.255.255.0'
    table: 1
    priority: 101
    cidr: '10.10.3.0/24'
    mtu: 1500
  hypervisor: gs2
  hostname: tst31
  disk: '40'
  dns1: '192.168.1.70'
  memory: '8192'
  os: noble-server-cloudimg-amd64.img
  nics: []
  domainname: ljalbinson.com
  host_type: host-passthrough
  dns2: '192.168.1.71'
  disks:
  - disk: 20
  cpu: '4'
  pdisks: []

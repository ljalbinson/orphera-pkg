params:
  pre_basic_packages:
  - qemu-guest-agent
  - openvswitch-switch
  basic_packages:
  - htop
  - tree
  - etckeeper
  - molly-guard
  - cpu-checker
  - iperf3
  - fping
  nic0:
    nic: enp1s0
    ipaddress: '10.10.5.50'
    gateway: '10.10.5.1'
    bridge: br-net105
    netmask: '255.255.255.0'
    table: 1
    priority: 101
    cidr: '10.10.5.0/24'
    mtu: 1500
  hypervisor: gs1
  hostname: scala1
  disk: '120'
  dns1: '192.168.1.70'
  memory: '4096'
  os: noble-server-cloudimg-amd64.img
  nics:
  # Provider network for Neutron (neutron_single_node.scala): a plain layer-2 NIC,
  # deliberately no address. A VM provisioned from this file has none; the one that
  # was provisioned earlier had 10.10.6.31 and neutron_single_node.scala removes it.
  - nic: enp2s0
    bridge: br-net106
    mtu: 9000
  domainname: ljalbinson.com
  host_type: host-passthrough
  dns2: '192.168.1.71'
  disks: []
  cpu: '2'
  pdisks: []

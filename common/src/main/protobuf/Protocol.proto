syntax = "proto3";

package orphera.common;

message InstallPackages {
  repeated string packages = 1;
  bool update_cache = 2;
}

message RemovePackages {
  repeated string packages = 1;
  bool purge = 2;
}

message AutoRemove {
  bool purge = 1;
}

message FileMetadata {
  string dest_path = 1;
  string owner = 2;
  string group = 3;
  uint32 mode = 4;
}

message FileChunk {
  oneof payload {
    FileMetadata metadata = 1;
    bytes content = 2;
  }
}

message FileCheck {
  string dest_path = 1;
  string sha256 = 2;
  string owner = 3;
  string group = 4;
  uint32 mode = 5;
}

message FileCheckResult {
  bool needs_copy = 1;
  string reason = 2;
}

message NetworkReload {
  uint32 confirm_timeout_seconds = 1;
}

message NetworkReloadResult {
  string backup_id = 1;
}

message NetworkConfirm {
  string backup_id = 1;
}

message InstallDeb {
  string path = 1;
}

message FetchFile {
  string path = 1;
}

message FileData {
  oneof payload {
    FileMetadata metadata = 1;
    bytes content = 2;
    string error = 3;
  }
}

message Empty {}

message Event {
  enum Kind {
    PROGRESS = 0;
    OUTPUT = 1;
    RESULT = 2;
  }
  Kind kind = 1;
  string message = 2;
  int32 exit_code = 3;
  bool success = 4;
}

service Agent {
  rpc Install(InstallPackages) returns (stream Event);
  rpc Remove(RemovePackages) returns (stream Event);
  rpc RunAutoRemove(AutoRemove) returns (stream Event);
  rpc CopyFile(stream FileChunk) returns (stream Event);
  rpc CheckFile(FileCheck) returns (FileCheckResult);
  rpc ReloadNetwork(NetworkReload) returns (NetworkReloadResult);
  rpc ConfirmNetwork(NetworkConfirm) returns (Empty);
  rpc InstallDebPackage(InstallDeb) returns (stream Event);
  rpc RemoteFetchFile(FetchFile) returns (stream FileData);
}


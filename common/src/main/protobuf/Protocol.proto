syntax = "proto3";

package orphera.common;

message InstallPackages {
  repeated string packages = 1;
  bool update_cache = 2;
}

message RemovePackages {
  repeated string packages = 1;
  bool purge = 2;
}

message AutoRemove {
  bool purge = 1;
}

message DistUpgrade {
  bool update_cache = 1;
}

message FileMetadata {
  string dest_path = 1;
  string owner = 2;
  string group = 3;
  uint32 mode = 4;
}

message FileChunk {
  oneof payload {
    FileMetadata metadata = 1;
    bytes content = 2;
  }
}

message FileCheck {
  string dest_path = 1;
  string sha256 = 2;
  string owner = 3;
  string group = 4;
  uint32 mode = 5;
}

message FileCheckResult {
  bool needs_copy = 1;
  string reason = 2;
}

message NetworkReload {
  uint32 confirm_timeout_seconds = 1;
}

message NetworkReloadResult {
  string backup_id = 1;
}

message NetworkConfirm {
  string backup_id = 1;
}

message InstallDeb {
  string path = 1;
}

message FetchFile {
  string path = 1;
}

message FileData {
  oneof payload {
    FileMetadata metadata = 1;
    bytes content = 2;
    string error = 3;
  }
}

message FactsRequest {}

message DiskInfo {
  string mount_point = 1;
  string filesystem = 2;
  uint64 total_bytes = 3;
  uint64 available_bytes = 4;
}

message NetworkInterface {
  string name = 1;
  repeated string ip_addresses = 2;
  string mac_address = 3;
}

message Facts {
  string hostname = 1;
  string os_id = 2;
  string os_version = 3;
  string kernel_version = 4;
  string architecture = 5;
  uint32 cpu_count = 6;
  uint64 memory_total_bytes = 7;
  repeated DiskInfo disks = 8;
  repeated NetworkInterface interfaces = 9;
  int64 collected_at_epoch_millis = 10;
}

message RebootRequest {
  uint32 delay_seconds = 1;
}

message RebootAck {
  string message = 1;
}

message ShutdownRequest {
  uint32 delay_seconds = 1;
}

message ShutdownAck {
  string message = 1;
}

message VersionRequest {}

message VersionInfo {
  string version = 1;
}

message UptimeRequest {}

message UptimeInfo {
  int64 uptime_seconds = 1;
  double load_average_1m = 2;
}

message ThreadInfoRequest {
  // Start the peak thread count again from the current count, after reading it.
  bool reset_peak = 1;
}

message NameCount {
  string name = 1;
  int32 count = 2;
}

message ThreadInfo {
  // Threads of the agent process as the operating system counts them: the Java
  // threads plus the JVM's own (garbage collector, compiler).
  int32 os_threads = 1;
  // Live Java threads, the most there have been since the JVM started (or since
  // the last reset), how many are daemon threads, and how many have ever started.
  int32 jvm_threads = 2;
  int32 jvm_peak = 3;
  int32 jvm_daemon = 4;
  int64 jvm_started = 5;
  int32 cpus = 6;
  int64 rss_bytes = 7;
  int64 heap_used_bytes = 8;
  // -1 when the JVM does not define a limit.
  int64 heap_max_bytes = 9;
  // Java threads by state (RUNNABLE, WAITING, ...), largest first.
  repeated NameCount states = 10;
  // The process's OS threads grouped by name, largest first.
  repeated NameCount groups = 11;
}

message RunCommandRequest {
  repeated string command = 1;
  int32 timeout_seconds = 2;
}

message CommandOutput {
  oneof payload {
    string stdout_line = 1;
    string stderr_line = 2;
  }
}

message CommandResult {
  int32 exit_code = 1;
  bool success = 2;
}

message Empty {}

message Event {
  enum Kind {
    PROGRESS = 0;
    OUTPUT = 1;
    RESULT = 2;
  }
  Kind kind = 1;
  string message = 2;
  int32 exit_code = 3;
  bool success = 4;
}

// One thing to read on the node, from a fixed list: the agent reads it itself
// (no script is run), so a role that may only look can make this call.
// kind is one of path, package, unit, user, group, sysctl, module, file_text,
// key, mount; target is what to read (a path, a package, a unit, a user, a
// group, a sysctl key, a module name, a mount point); extra is a second
// argument for sysctl and module (the file the setting is persisted in) and for
// key (the key's "type base64"). An agent that does not know a kind answers
// that item with an error.
message Observation {
  int32 id = 1;
  string kind = 2;
  string target = 3;
  string extra = 4;
}

message ObserveRequest {
  repeated Observation items = 1;
}

// What was read: values by name (type, mode, owner, group, sha256, installed,
// ... as the kind defines), or an error when this item could not be read.
message ObservedItem {
  int32 id = 1;
  map<string, string> values = 2;
  string error = 3;
}

message ObserveReply {
  repeated ObservedItem items = 1;
}

// Changes to files and kernel settings, from a fixed list, that the agent makes
// itself (no script is run), so that a role may be given these and not `run`.
// Strings that name a mode are octal ("0644"); an empty mode, owner or group
// is left as it is.
message MakeDirectory {
  string path = 1;      // made with its parents if it is not there
  string mode = 2;
  string owner = 3;
  string group = 4;
}

message SetAttributes {
  string path = 1;
  string mode = 2;
  string owner = 3;
  string group = 4;
}

// Removes a file or link, or (directory) an empty directory, or (directory and
// recursive) a directory with everything in it. The tree is never followed
// across a symbolic link or into another filesystem.
message RemovePath {
  string path = 1;
  bool directory = 2;
  bool recursive = 3;
}

// path becomes a symbolic link to target, replacing a file or another link.
message MakeSymlink {
  string path = 1;
  string target = 2;
}

message SetSysctl {
  string key = 1;
  string value = 2;
}

message LoadModule {
  string name = 1;
}

// Replaces a file's text, keeping its mode and owner (or creating it, with
// create_mode and as root). When expected_sha256 is not empty the file must
// still have that hash, so an edit worked out from an earlier read cannot
// overwrite a change made since; empty means the file must not exist yet.
message ReplaceText {
  string path = 1;
  string content = 2;
  string expected_sha256 = 3;
  string create_mode = 4;
  // With no expected_sha256: replace a regular file that exists, whatever it
  // holds (a file the orchestrator owns, such as one it persists a setting in).
  bool overwrite = 5;
}

message FileAction {
  oneof action {
    MakeDirectory make_directory = 1;
    SetAttributes set_attributes = 2;
    RemovePath remove_path = 3;
    MakeSymlink make_symlink = 4;
    SetSysctl set_sysctl = 5;
    LoadModule load_module = 6;
    ReplaceText replace_text = 7;
  }
}

message ApplyFilesRequest {
  repeated FileAction actions = 1;
}

// How far it got: the actions are made in order and it stops at the first that
// fails, naming it in error.
message ApplyReply {
  int32 completed = 1;
  string error = 2;
}

// Changes to users, groups, authorized keys and mounts, from a fixed list, that
// the agent makes itself. These give or take away ways to log in and what is
// mounted where, so they are a separate call (and policy operation) from
// ApplyFiles. A string that names a number (uid, gid) is empty when it is not
// asked for.
message CreateUser {
  string name = 1;
  string uid = 2;
  string group = 3;
  repeated string groups = 4;
  string home = 5;
  string shell = 6;
  bool system = 7;
  bool create_home = 8;
}

// Changes what is set; add_groups are added to the user's groups, not replaced.
message ModifyUser {
  string name = 1;
  string uid = 2;
  string group = 3;
  repeated string add_groups = 4;
  string home = 5;
  string shell = 6;
}

message DeleteUser {
  string name = 1;
}

message CreateGroup {
  string name = 1;
  string gid = 2;
  bool system = 3;
}

message ModifyGroup {
  string name = 1;
  string gid = 2;
}

message DeleteGroup {
  string name = 1;
}

// Adds a line to the user's ~/.ssh/authorized_keys (made, with the right owner
// and mode, if needed).
message AddAuthorizedKey {
  string user = 1;
  string key = 2;
}

// Removes the lines whose first two fields are key_id ("type base64").
message RemoveAuthorizedKey {
  string user = 1;
  string key_id = 2;
}

// Replaces /etc/fstab, only if it still has expected_sha256.
message ReplaceFstab {
  string content = 1;
  string expected_sha256 = 2;
}

message MountPath {
  string path = 1;
  bool make_directory = 2;
}

message Remount {
  string path = 1;
}

message Unmount {
  string path = 1;
}

message AccessAction {
  oneof action {
    CreateUser create_user = 1;
    ModifyUser modify_user = 2;
    DeleteUser delete_user = 3;
    CreateGroup create_group = 4;
    ModifyGroup modify_group = 5;
    DeleteGroup delete_group = 6;
    AddAuthorizedKey add_authorized_key = 7;
    RemoveAuthorizedKey remove_authorized_key = 8;
    ReplaceFstab replace_fstab = 9;
    MountPath mount_path = 10;
    Remount remount = 11;
    Unmount unmount = 12;
  }
}

message ApplyAccessRequest {
  repeated AccessAction actions = 1;
}

// Installs a package, at `version` if given (as the package manager names it;
// an installed other version is replaced, a lower one downgraded).
message PackageInstall {
  string name = 1;
  string version = 2;
  bool update_cache = 3;
}

message PackageRemove {
  string name = 1;
}

// verb: enable, disable, start, stop, restart or try-restart.
message UnitControl {
  string unit = 1;
  string verb = 2;
}

// systemctl daemon-reload
message ReloadUnits {}

message SoftwareAction {
  oneof action {
    PackageInstall package_install = 1;
    PackageRemove package_remove = 2;
    UnitControl unit_control = 3;
    ReloadUnits reload_units = 4;
  }
}

message ApplySoftwareRequest {
  repeated SoftwareAction actions = 1;
}

service Agent {
  rpc Install(InstallPackages) returns (stream Event);
  rpc Remove(RemovePackages) returns (stream Event);
  rpc RunAutoRemove(AutoRemove) returns (stream Event);
  rpc RunDistUpgrade(DistUpgrade) returns (stream Event);
  rpc CopyFile(stream FileChunk) returns (stream Event);
  rpc CheckFile(FileCheck) returns (FileCheckResult);
  rpc ReloadNetwork(NetworkReload) returns (NetworkReloadResult);
  rpc ConfirmNetwork(NetworkConfirm) returns (Empty);
  rpc InstallDebPackage(InstallDeb) returns (stream Event);
  rpc RemoteFetchFile(FetchFile) returns (stream FileData);
  rpc GatherFacts(FactsRequest) returns (Facts);
  rpc TriggerReboot(RebootRequest) returns (RebootAck);
  rpc TriggerShutdown(ShutdownRequest) returns (ShutdownAck);
  rpc GetVersion(VersionRequest) returns (VersionInfo);
  rpc GetUptime(UptimeRequest) returns (UptimeInfo);
  rpc GetThreadInfo(ThreadInfoRequest) returns (ThreadInfo);
  rpc ExecuteCommand(RunCommandRequest) returns (stream Event);
  rpc ObserveNode(ObserveRequest) returns (ObserveReply);
  rpc ApplyFiles(ApplyFilesRequest) returns (ApplyReply);
  rpc ApplyAccess(ApplyAccessRequest) returns (ApplyReply);
  rpc ApplySoftware(ApplySoftwareRequest) returns (ApplyReply);
}


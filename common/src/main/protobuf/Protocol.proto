syntax = "proto3";

package orphera.common;

message InstallPackages {
  repeated string packages = 1;
  bool update_cache = 2;
}

message Event {
  enum Kind {
    PROGRESS = 0;
    OUTPUT = 1;
    RESULT = 2;
  }
  Kind kind = 1;
  string message = 2;
  int32 exit_code = 3;
  bool success = 4;
}

service Agent {
  rpc Install(InstallPackages) returns (stream Event);
}

syntax = "proto3";

package orphera.common;

message InstallPackages {
  repeated string packages = 1;
  bool update_cache = 2;
}

message RemovePackages {
  repeated string packages = 1;
  bool purge = 2;
}

message AutoRemove {
  bool purge = 1;
}

message FileMetadata {
  string dest_path = 1;
  string owner = 2;
  string group = 3;
  uint32 mode = 4;
}

message FileChunk {
  oneof payload {
    FileMetadata metadata = 1;
    bytes content = 2;
  }
}

message FileCheck {
  string dest_path = 1;
  string sha256 = 2;
  string owner = 3;
  string group = 4;
  uint32 mode = 5;
}

message FileCheckResult {
  bool needs_copy = 1;
  string reason = 2;
}

message NetworkReload {
  uint32 confirm_timeout_seconds = 1;
}

message NetworkReloadResult {
  string backup_id = 1;
}

message NetworkConfirm {
  string backup_id = 1;
}

message InstallDeb {
  string path = 1;
}

message FetchFile {
  string path = 1;
}

message FileData {
  oneof payload {
    FileMetadata metadata = 1;
    bytes content = 2;
    string error = 3;
  }
}

message FactsRequest {}

message DiskInfo {
  string mount_point = 1;
  string filesystem = 2;
  uint64 total_bytes = 3;
  uint64 available_bytes = 4;
}

message NetworkInterface {
  string name = 1;
  repeated string ip_addresses = 2;
  string mac_address = 3;
}

message Facts {
  string hostname = 1;
  string os_id = 2;
  string os_version = 3;
  string kernel_version = 4;
  string architecture = 5;
  uint32 cpu_count = 6;
  uint64 memory_total_bytes = 7;
  repeated DiskInfo disks = 8;
  repeated NetworkInterface interfaces = 9;
  int64 collected_at_epoch_millis = 10;
}

message RebootRequest {
  uint32 delay_seconds = 1;
}

message RebootAck {
  string message = 1;
}

message VersionRequest {}

message VersionInfo {
  string version = 1;
}

message UptimeRequest {}

message UptimeInfo {
  int64 uptime_seconds = 1;
  double load_average_1m = 2;
}

message RunCommandRequest {
  repeated string command = 1;
  int32 timeout_seconds = 2;
}

message CommandOutput {
  oneof payload {
    string stdout_line = 1;
    string stderr_line = 2;
  }
}

message CommandResult {
  int32 exit_code = 1;
  bool success = 2;
}

message Empty {}

message Event {
  enum Kind {
    PROGRESS = 0;
    OUTPUT = 1;
    RESULT = 2;
  }
  Kind kind = 1;
  string message = 2;
  int32 exit_code = 3;
  bool success = 4;
}

service Agent {
  rpc Install(InstallPackages) returns (stream Event);
  rpc Remove(RemovePackages) returns (stream Event);
  rpc RunAutoRemove(AutoRemove) returns (stream Event);
  rpc CopyFile(stream FileChunk) returns (stream Event);
  rpc CheckFile(FileCheck) returns (FileCheckResult);
  rpc ReloadNetwork(NetworkReload) returns (NetworkReloadResult);
  rpc ConfirmNetwork(NetworkConfirm) returns (Empty);
  rpc InstallDebPackage(InstallDeb) returns (stream Event);
  rpc RemoteFetchFile(FetchFile) returns (stream FileData);
  rpc GatherFacts(FactsRequest) returns (Facts);
  rpc TriggerReboot(RebootRequest) returns (RebootAck);
  rpc GetVersion(VersionRequest) returns (VersionInfo);
  rpc GetUptime(UptimeRequest) returns (UptimeInfo);
  rpc ExecuteCommand(RunCommandRequest) returns (stream Event);
}


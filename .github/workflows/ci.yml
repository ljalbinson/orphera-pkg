name: CI

on: [push, pull_request]

jobs:
  compile_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - run: sbt -Dsbt.color=false clean compile "scalafixAll --check" test 2>&1 | tee sbt.log; exit ${PIPESTATUS[0]}
        shell: bash
      # TEMPORARY (dev/scalafix-wartremover): surface sbt errors as an annotation
      - if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          tail -n 250 sbt.log | cut -c1-300 > tail.log
          msg=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' tail.log | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=sbt-log::${msg}"
          exit 0

# SPDX-License-Identifier: Apache-2.0
#
# Builds the Scaladoc of the common, agent and orchestrator modules on every push to main and publishes it with
# GitHub Pages (https://<owner>.github.io/<repo>/). Needs Settings > Pages > Source set to "GitHub Actions" once.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scaladoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - name: Build the Scaladoc
        run: sbt common/doc agent/doc orchestrator/doc
      - name: Collect the pages
        run: |
          mkdir -p site
          for m in common agent orchestrator; do
            cp -r "$m"/target/scala-*/api "site/$m"
          done
          {
            echo '<!doctype html><meta charset="utf-8"><title>Orphera API documentation</title>'
            echo '<h1>Orphera API documentation</h1><ul>'
            echo '<li><a href="orchestrator/index.html">orchestrator</a> (the apply DSL is <code>orphera.orchestrator.Resources</code>)</li>'
            echo '<li><a href="agent/index.html">agent</a></li>'
            echo '<li><a href="common/index.html">common</a></li>'
            echo '</ul>'
          } > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scaladoc
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
